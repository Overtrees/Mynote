<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="此刻 — 值得被记住">

  <!--
    官方全页外壳（2026-11-21 迁移）：引擎视图直接占满页面，页面滚动
    在应用内部。viewport-fit=cover 让视图延伸到安全区内，引擎
    MediaQuery 读到的即浏览器 env 真值；html/body 底色与应用底色
    同值同源（#F2F2F7 / #000），画布之外不露异色。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <style>html,body{background:#F2F2F7}@media (prefers-color-scheme: dark){html,body{background:#000000}}</style>
  <script>
    // bootstrap 注入的 viewport meta 不带 viewport-fit=cover，页面会被
    // 限制在安全区内、上下留出浏览器涂的色块；这里持续补上 cover。
    function __fixVp(){document.querySelectorAll('meta[name="viewport"]').forEach(function(m){if(!/viewport-fit/.test(m.content)) m.setAttribute('content', m.content + ', viewport-fit=cover');});}
    new MutationObserver(__fixVp).observe(document.head,{childList:true});
    document.addEventListener('DOMContentLoaded', __fixVp);
  </script>

  <!-- iOS meta tags & icons（与原版 Moment.html 逐项对齐） -->

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>此刻</title>
  <style>
    /* 启动屏（原版 launch.css）：icon-muted 两态色、动画受
       prefers-reduced-motion 门控、转圈 1.1s */
    .ld-dino { color: #8A9BB0; }
    .ld-spin circle { stroke: #8E8E93; }
    @media (prefers-reduced-motion: no-preference) {
      .ld-dino { animation: dinoFloat 2.4s ease-in-out infinite; }
      .ld-spin { animation: appspin 1.1s linear infinite; }
    }
    @media (prefers-color-scheme: dark) {
      #app-loading { background: #000000 !important; color: #F2F2F7 !important; }
      .ld-dino { color: #E5E7EB; }
      .ld-spin circle { stroke: #98989D; }
    }
    @keyframes appspin{to{transform:rotate(360deg)}}
    @keyframes dinoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  </style>
  <link rel="manifest" href="manifest.json">
  <script>
    // Diag 诊断日志持久化（localStorage）：崩溃/重载后仍可读
    window.mynoteDiagLoad = function () { try { return localStorage.getItem('mynote_diag_v1'); } catch (e) { return null; } };
    window.mynoteDiagSave = function (s) { try { localStorage.setItem('mynote_diag_v1', s); } catch (e) {} };
    // 启动失败自诊断：收集 JS 错误，供看门狗在启动屏上直接展示
    window.__mynoteErrs = [];
    window.addEventListener('error', function (e) {
      try { window.__mynoteErrs.push(String((e && e.message) || e).slice(0, 200)); } catch (err) {}
    });
    window.addEventListener('unhandledrejection', function (e) {
      try { window.__mynoteErrs.push('rejection: ' + String((e && e.reason) || e).slice(0, 200)); } catch (err) {}
    });
    // 启动阶段打点（外壳侧）：看门狗诊断页展示，定位启动链断点
    window.__mynoteStages = [];
    window.__mynoteStage = function (s) {
      try { window.__mynoteStages.push(s + '@' + Math.round(performance.now())); } catch (e) {}
    };
    window.__mynoteStage('shell-exec');
  </script>
  <script>
    // 粘贴拦截（捕获阶段）：含 http 文本或图片文件时先拦下，交由
    // Dart 侧 paste_policy 分类处理；普通文本放行 Flutter 原生管线。
    window.__mynotePasteText = '';
    window.__mynotePasteImageCount = 0;
    window.__mynotePasteFiles = [];
    window.__mynotePasteTypes = [];
    window.addEventListener('paste', function (e) {
      try {
        var cd = e.clipboardData; if (!cd) return;
        var text = cd.getData('text/plain') || '';
        var files = [];
        if (cd.files) { for (var i = 0; i < cd.files.length; i++) { if (cd.files[i].type.indexOf('image/') === 0) files.push(cd.files[i]); } }
        if (files.length || /https?:\/\//.test(text)) {
          e.preventDefault(); e.stopPropagation();
          window.__mynotePasteText = text;
          window.__mynotePasteImageCount = files.length;
          window.__mynotePasteFiles = files;
          window.__mynotePasteTypes = files.map(function (f) { return f.type || ''; });
          window.dispatchEvent(new Event('mynote-paste'));
        }
      } catch (err) {}
    }, true);
  </script>
  <script>
    // 附件打开（原版 openAttachmentFile）：能分享先走系统分享面板，
    // 返回 'shared'/'aborted' 表示已处理；其余情况 Dart 侧退化为下载。
    window.__mynoteShareFile = async function (name, type, bytes) {
      try {
        var file = new File([new Uint8Array(bytes)], name, { type: type || 'application/octet-stream' });
        if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          await navigator.share({ files: [file] });
          return 'shared';
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return 'aborted';
      }
      return 'unsupported';
    };
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <svg class="ld-dino" viewBox="0 0 512 512" width="100" height="100" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px">

      <path d="M 250,323 L 255,305 L 263,326 M 273,329 L 280,308 L 288,333 M 298,336 L 306,313 L 314,340 M 324,343 L 333,318 L 341,346 M 351,348 L 361,323 L 369,351 M 379,352 L 389,328 L 396,353 M 404,351 L 413,330 L 418,348"/>
    </svg>
    <svg class="ld-spin" width="36" height="36" viewBox="0 0 36 36" style="margin-bottom:24px">
      <circle cx="18" cy="18" r="15" fill="none" stroke="#8E8E93" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="60 40"/>
    </svg>
    <div style="font-size:13px;color:#8E8E93;letter-spacing:0.2px">此刻，值得被记住</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      window.__mynoteFirstFrame = true;
      window.__mynoteStage('first-frame');
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
    // 兜底：启动屏保持到首帧为止（Safari 单线程编译 wasm 可能要数分钟，
    // 过早撤屏只会让用户对着空白页）；120 秒是最后防线，避免永久盖屏。
    setTimeout(function () {
      var l = document.getElementById('app-loading');
      if (l && !window.__mynoteFirstFrame) l.style.display = 'none';
    }, 120000);
    // 看门狗：90 秒后首帧仍未到，说明启动链断了——把诊断直接写在
    // 屏幕上（引擎状态 / JS 错误 / 持久化 Diag 尾部），用户截图即可
    // 定位，不必进设置页。
    setTimeout(function () {
      if (window.__mynoteFirstFrame) return;
      var diag = '';
      try { diag = window.mynoteDiagLoad() || ''; } catch (e) {}
      if (diag.length > 1500) diag = diag.slice(-1500);
      var lines = [
        '启动诊断（请截图发我）',
        'firstFrame: ' + (window.__mynoteFirstFrame ? 'yes' : 'no'),
        'crossOriginIsolated: ' + window.crossOriginIsolated,
        'flutter-view: ' + (document.querySelector('flutter-view') ? 'yes' : 'no'),
        'scrollH: ' + document.documentElement.scrollHeight + ' innerH: ' + window.innerHeight,
        'errors: ' + (window.__mynoteErrs.length ? window.__mynoteErrs.join(' | ') : '(none)'),
        'stages: ' + ((window.__mynoteStages || []).join(' > ') || '(none)'),
        'resources: ' + (function () {
          try {
            var es = performance.getEntriesByType('resource');
            var out = [];
            for (var i = Math.max(0, es.length - 14); i < es.length; i++) {
              var n = es[i].name.split('/').pop().slice(0, 28);
              out.push(n + ':' + Math.round(es[i].duration) + 'ms/' + (es[i].transferSize || 0));
            }
            return out.join(' ') || '(none)';
          } catch (e) { return '(unavailable)'; }
        })(),
        '--- Diag 尾部 ---',
        diag || '(empty)'
      ];
      var box = document.getElementById('app-loading');
      if (!box) {
        box = document.createElement('div');
        box.id = 'app-loading';
        document.body.appendChild(box);
      }
      box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#ffffff;color:#111111;overflow:auto;padding:48px 16px 24px;font-family:monospace;';
      var pre = document.createElement('pre');
      pre.style.cssText = 'white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.5;margin:0;';
      pre.textContent = lines.join('\n');
      box.textContent = '';
      box.appendChild(pre);
      box.style.display = 'block';
    }, 90000);
  </script>
