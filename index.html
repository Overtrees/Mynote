<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="此刻">
    <link rel="apple-touch-icon" href="Mynoteicon.png">
    <link rel="manifest" href="manifest.json">

    <!-- 预加载主应用，加快跳转速度 -->
    <link rel="preload" href="Moments.html" as="document">

    <!-- 深/浅色模式状态栏颜色跟随 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <!-- 注意：原有的自动跳转脚本已移除。现在所有启动方式都先展示恐龙启动页! -->

<style>
    :root {
        --primary-bg: #ffffff;
        --text-main: #1a1a1a;
        --text-secondary: #8e8e93;
        --btn-bg: rgba(240, 240, 242, 0.7);
        --border-color: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --primary-bg: #000000;
            --text-main: #ffffff;
            --text-secondary: #98989d;
            --btn-bg: rgba(44, 44, 46, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
        height: 100%;
        background-color: var(--primary-bg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
        color: var(--text-main);
    }

    .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 0;
        padding-bottom: env(safe-area-inset-bottom);
    }

    /* 恐龙 */
    .dino {
        font-size: 72px;
        line-height: 1;
        margin-bottom: 20px;
        /* 默认无动画，动画在媒体查询内启用 */
    }

    /* SVG 加载圈 */
    .spinner {
        width: 36px;
        height: 36px;
        margin-bottom: 24px;
        /* 动画在媒体查询内启用 */
    }
    .spinner circle {
        fill: none;
        stroke: var(--text-secondary);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 60 40;
    }

    /* 倒计时文字 */
    .countdown-text {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 16px;
        letter-spacing: 0.2px;
    }

    /* 手动进入按钮，引用 app 胶囊样式 */
    .enter-btn {
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        background: var(--btn-bg);
        border: 0.5px solid var(--border-color);
        border-radius: 20px;
        padding: 8px 22px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        letter-spacing: -0.2px;
    }
    .enter-btn:active {
        opacity: 0.7;
    }

    /* 仅在用户未主动减少动态效果时启用动画 */
    @media (prefers-reduced-motion: no-preference) {
        .dino {
            animation: dinoFloat 2.4s ease-in-out infinite;
        }
        .spinner {
            animation: spinRotate 1.1s linear infinite;
        }
        @keyframes dinoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes spinRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    }
</style>

</head>
<body>
    <div class="splash">
        <div class="dino">
            <svg viewBox="0 0 512 512" width="100" height="100" fill="none" stroke="#8A9BB0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 90,460 L 90,170 C 90,110 140,70 210,70 L 380,95 C 440,95 470,130 470,185 C 470,225 450,240 410,245 C 350,250 280,230 210,265 C 190,275 190,295 210,310 C 270,350 350,380 410,360 C 435,350 440,325 410,315"/>
                <path d="M 160,330 C 180,380 230,440 280,460"/>
                <path d="M 240,365 C 220,400 240,440 310,460"/>
                <path d="M 90,460 L 310,460"/>
                <path d="M 415,135 C 425,140 435,150 435,160"/>
                <path d="M 230,115 C 260,95 310,120 355,140"/>
                <path d="M 255,140 C 255,170 290,195 320,185 C 345,175 350,150 335,135"/>
                <path d="M 290,145 C 290,165 315,165 315,150"/>
                <path d="M 250,243 L 255,265 L 265,243 M 275,245 L 282,270 L 292,245 M 302,246 L 310,273 L 320,247 M 330,248 L 340,275 L 350,248 M 360,249 L 370,274 L 380,248 M 390,248 L 400,270 L 408,246 M 415,244 L 425,263 L 432,240 M 438,235 L 448,252 L 452,228"/>
                <path d="M 250,323 L 255,305 L 263,326 M 273,329 L 280,308 L 288,333 M 298,336 L 306,313 L 314,340 M 324,343 L 333,318 L 341,346 M 351,348 L 361,323 L 369,351 M 379,352 L 389,328 L 396,353 M 404,351 L 413,330 L 418,348"/>
            </svg>
        </div>

        <svg class="spinner" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="15" />
        </svg>

        <div class="countdown-text" id="countdown">6 秒后自动进入</div>
        <button class="enter-btn" onclick="window.location.replace('Moments.html')">立即进入</button>
    </div>

    <script>
        let seconds = 6;
        const el = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.replace('Moments.html');
            } else {
                el.textContent = seconds + ' 秒后自动进入';
            }
        }, 1000);
    </script>

</body>
</html>
