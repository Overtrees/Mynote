name: mynote-flutter

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
  pull_request:
    paths:
      - 'native/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/ test/
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

  ios-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        working-directory: native/app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry mynote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: mynote-unsigned-ipa
          path: native/app/build/ios/iphoneos/mynote-unsigned.ipa
